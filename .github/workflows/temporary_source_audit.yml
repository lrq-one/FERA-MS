name: Temporary diagnostic wording verification
on:
  push:
    branches:
      - audit/iceberg-ce-recovery-20260918
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix only verified English translation artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          changes={
            'test/benchmark_final_model.py':[('" output.."','" output."')],
            'test/evaluate_metric_robustness.py':[('"runtime spectrum_allocator in"','"In runtime spectrum_allocator, "')],
            'test/rebuild_retrieval_neutral_losses.py':[
              ('f"{len(reference_files)}  "','f"{len(reference_files)} files"'),
              ('f"{len(LOSSES)}  , cache column count={width}"','f"{len(LOSSES)} losses, cache column count={width}"'),
              ('"[3/5] Run on the locked cache:100%rule-replay validation"','"[3/5] Verify 100% rule replay on the locked cache"'),
              ('f"{len(reference_rows)}  rows, "','f"{len(reference_rows)} rows, "'),
              ('f"{len(unique_formulas)}  unique formulas all match"','f"{len(unique_formulas)} unique formulas all match"'),
              ('f"{len(target_files)}  , workers={WORKERS}"','f"{len(target_files)} files, workers={WORKERS}"'),
              ('"[2/5] Fix NL template: "','"[2/5] Lock NL template: "'),
              ('f"reference NL column count mismatch: {dict(widths)}"','f"Reference NL column count mismatch: {dict(widths)}"')],
            'test/run_paired_bootstrap.py':[
              ('f"{label} exists NaN or nonnumeric"','f"{label} contains NaN or nonnumeric values"'),
              ('f"seed{seed} "','f"seed {seed}: "'),
              ('"Missing coverage for 3-seed spectra"','"Some spectra are missing one or more of the three seeds"')],
            'test/summarize_ace_stratified.py':[
              ('"Summarize ACE stratified CBIN, JSS and CHUN results."','"Summarize ACE-stratified CBIN, JSS and CHUN results across three random seeds."'),
              ('"For example runs/experiments/"','"For example, runs/experiments/"')],
            'test/summarize_metric_robustness.py':[
              ('f"seed {seed} has"','f"seed {seed} has "'),
              ('f"seed {seed} Incorrect','f"seed {seed}: incorrect')],
            'train/_impl/run_refinement.sh':[
              ('"Not detected:nvidia-smi, stopped."','"nvidia-smi was not detected; stopping."'),
              ('"[RESUME] spectrum allocator allocator already exists."','"[RESUME] spectrum allocator already exists."')],
          }
          changes.update({file:[('"To prevent evaluating the wrong model, stopped test evaluation."','"Stopped test evaluation to avoid using an incorrect model."')] for file in ('test/evaluate_ace_perturbation.py','test/evaluate_chun.py','test/evaluate_metric_robustness.py')})
          # Preserve the independent runtime-specific correction as well.
          changes['test/evaluate_metric_robustness.py'].append(('"runtime spectrum_allocator in"','"In runtime spectrum_allocator, "'))
          for name, replacements in changes.items():
              path=Path(name); text=path.read_text(encoding='utf-8')
              for old,new in replacements:
                  if old not in text and new in text:continue
                  assert old in text,(name,old)
                  text=text.replace(old,new)
              if name.endswith('.py'):ast.parse(text,filename=name)
              path.write_text(text,encoding='utf-8')
          PY
          git diff --check
          bash -n train/_impl/run_refinement.sh
          python -m compileall -q test train
          git add -u
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Polish English diagnostic translations without altering computation'
          git push origin HEAD:audit/iceberg-ce-recovery-20260918
